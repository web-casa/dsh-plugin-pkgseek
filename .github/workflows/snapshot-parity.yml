name: snapshot-parity

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the bundled snapshot matches the live tool list
        run: |
          node scripts/sync-tools.mjs
          if ! git diff --quiet tools.snapshot.json; then
            echo "::error::tools.snapshot.json is stale; run npm run sync-tools and commit"
            git --no-pager diff --stat tools.snapshot.json
            exit 1
          fi
          echo "snapshot is in sync with the live endpoint"
